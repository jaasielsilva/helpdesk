# ========================================
# PROFILE: PRODUÇÃO
# ========================================
spring.profiles.active=prod

# Datasource (Use variáveis de ambiente!)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Logging
logging.level.root=WARN
logging.level.com.jaasielsilva.helpdesk=INFO
logging.level.org.springframework.security=WARN

# Server
server.port=${APP_PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT (obrigatório em produção — use scripts/generate-jwt-secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
