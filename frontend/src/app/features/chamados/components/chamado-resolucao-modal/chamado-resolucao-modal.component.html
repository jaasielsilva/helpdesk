<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" (click)="fechar.emit()">
  <div class="panel w-full max-w-lg p-6 bg-white" (click)="$event.stopPropagation()">

    <div class="border-b border-slate-100 pb-4 mb-5">
      <div class="flex items-center gap-3 mb-1">
        <span class="w-9 h-9 rounded-full bg-green-100 flex items-center justify-center text-lg flex-shrink-0">✅</span>
        <h3 class="text-lg font-bold text-slate-800">Marcar como Resolvido</h3>
      </div>
      <p class="text-xs text-slate-500 ml-12">
        Descreva a solução aplicada. Ela será registrada no histórico do chamado.
      </p>
    </div>

    <!-- Chamado resumido -->
    <div class="bg-slate-50 rounded-lg px-4 py-3 mb-5 border border-slate-100">
      <p class="text-xs text-slate-500 uppercase font-bold tracking-wider mb-1">Chamado #{{ chamado.id }}</p>
      <p class="text-sm font-semibold text-slate-700 truncate">{{ chamado.titulo }}</p>
    </div>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="confirmar()">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Solução aplicada <span class="text-rose-500">*</span>
        </label>
        <textarea
          formControlName="solucao"
          rows="5"
          class="input-field resize-none"
          [class.border-rose-500]="invalido('solucao')"
          placeholder="Ex: Reinstalado o driver de rede. Problema causado por atualização automática do Windows..."
        ></textarea>
        @if (invalido('solucao')) {
          <p class="text-xs text-rose-500 mt-1 animate-slideDown">⚠️ Descreva a solução (mín. 10 caracteres).</p>
        }
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" class="btn-secondary flex-1 py-2.5" (click)="fechar.emit()">Cancelar</button>
        <button type="submit" class="btn-primary flex-1 py-2.5 bg-green-600" [disabled]="salvando">
          {{ salvando ? 'Salvando...' : '✅ Confirmar resolução' }}
        </button>
      </div>
    </form>
  </div>
</div>
